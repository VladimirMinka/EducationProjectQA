services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    # local-only: меньше fsync, быстрее первый SELECT после старта контейнера.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - synchronous_commit=off
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  store:
    build: .
    ports:
      - "50051:50051" # gRPC
      - "8081:8080"   # HTTP JSON gateway + UI (host 8081 → container 8080)
    environment:
      DATABASE_URL: postgres://store:store@postgres:5432/store?sslmode=disable
      JWT_SECRET: dev-secret-change-me
      # IPv4 loopback: `:50051` внутри Alpine иногда сначала идёт в IPv6 и подвисает.
      GRPC_ENDPOINT: 127.0.0.1:50051
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
