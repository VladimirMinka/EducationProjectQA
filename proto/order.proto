syntax = "proto3";

package store.order.v1;

option go_package = "store/api/order/v1;order";

import "google/api/annotations.proto";

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (OrderResponse) {
    option (google.api.http) = {
      post: "/v1/orders"
      body: "*"
    };
  }

  rpc GetOrder (GetOrderRequest) returns (OrderResponse) {
    option (google.api.http) = {
      get: "/v1/orders/{order_id}"
    };
  }

  rpc CancelOrder (CancelOrderRequest) returns (OrderResponse) {
    option (google.api.http) = {
      post: "/v1/orders/{order_id}/cancel"
      body: "*"
    };
  }

  rpc UpdateOrderStatus (UpdateOrderStatusRequest) returns (OrderResponse) {
    option (google.api.http) = {
      post: "/v1/orders/{order_id}/status"
      body: "*"
    };
  }

  rpc DeleteOrder (DeleteOrderRequest) returns (DeleteOrderResponse) {
    option (google.api.http) = {
      delete: "/v1/orders/{order_id}"
    };
  }

  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}/orders"
    };
  }

  rpc ListOrderJobs (ListOrderJobsRequest) returns (ListOrderJobsResponse) {
    option (google.api.http) = {
      get: "/v1/admin/orders/{order_id}/jobs"
    };
  }
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_CREATED = 1;
  ORDER_STATUS_PAID = 2;
  ORDER_STATUS_SHIPPED = 3;
  ORDER_STATUS_CANCELLED = 4;
  ORDER_STATUS_COMPLETED = 5;
}

enum DeliveryMethod {
  DELIVERY_METHOD_UNSPECIFIED = 0;
  DELIVERY_METHOD_COURIER = 1;
  DELIVERY_METHOD_PICKUP = 2;
}

message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
  int64 price_cents = 3;
}

message DeliveryInfo {
  string recipient_name = 1;
  string phone = 2;
  string city = 3;
  string street = 4;
  string building = 5;
  string apartment = 6;
  string postal_code = 7;
  string address_line = 8;
  string pickup_code = 9;
  string pickup_address = 10;
  string work_hours = 11;
}

message Order {
  string id = 1;
  string user_id = 2;
  repeated OrderItem items = 3;
  int64 total_amount_cents = 4;
  OrderStatus status = 5;
  string created_at = 6;
  DeliveryMethod delivery_method = 7;
  int64 delivery_fee_cents = 8;
  DeliveryInfo delivery_info = 9;
}

message CreateOrderRequest {
  string user_id = 1;
  DeliveryMethod delivery_method = 2;
  string address_id = 3;
  string pickup_point_id = 4;
}

message ListOrdersRequest {
  string user_id = 1;
}

message ListOrdersResponse {
  repeated Order orders = 1;
}

message GetOrderRequest {
  string order_id = 1;
}

message CancelOrderRequest {
  string order_id = 1;
}

message DeleteOrderRequest {
  string order_id = 1;
}

message UpdateOrderStatusRequest {
  string order_id = 1;
  OrderStatus from_status = 2;
  OrderStatus to_status = 3;
}

message OrderResponse {
  Order order = 1;
}

message DeleteOrderResponse {}

enum OrderJobStatus {
  ORDER_JOB_STATUS_UNSPECIFIED = 0;
  ORDER_JOB_STATUS_PENDING = 1;
  ORDER_JOB_STATUS_DONE = 2;
  ORDER_JOB_STATUS_FAILED = 3;
  ORDER_JOB_STATUS_CANCELLED = 4;
}

message OrderJob {
  string id = 1;
  string order_id = 2;
  OrderStatus from_status = 3;
  OrderStatus to_status = 4;
  string run_at = 5;
  OrderJobStatus status = 6;
  int32 attempts = 7;
  string last_error = 8;
  string created_at = 9;
  string processed_at = 10;
}

message ListOrderJobsRequest {
  string order_id = 1;
}

message ListOrderJobsResponse {
  repeated OrderJob jobs = 1;
}
